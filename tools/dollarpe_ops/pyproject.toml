[project]
name = "dollarpe-ops"
version = "0.1.0"
description = "DollarPe Bot ops status over Nebula/Nova/Stargate/Horizon and friends"
requires-python = ">=3.11"
license = "Apache-2.0 OR MIT"
dependencies = ["click>=8.1.7"]

[project.scripts]
dollarpe-ops = "centaur_tool_dollarpe_ops.cli:main"

[tool.centaur]
module = "client.py"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.build.targets.wheel.sources]
"." = "centaur_tool_dollarpe_ops"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
