[project]
name = "infra-status"
version = "0.1.0"
description = "Sample infra / on-call status tool for the Centaur overlay"
requires-python = ">=3.11"
license = "Apache-2.0 OR MIT"
dependencies = ["click>=8.1.7"]

[project.scripts]
infra-status = "centaur_tool_infra_status.cli:main"

[tool.centaur]
module = "client.py"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.build.targets.wheel.sources]
"." = "centaur_tool_infra_status"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
